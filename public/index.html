<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kawalpreet &amp; Avneesh — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0d0404;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }

  /* ═══════════════════════════════
     VIDEO LAYER
  ═══════════════════════════════ */
  #video-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    z-index: 1;
  }

  #wedding-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ═══════════════════════════════
     CURTAIN STAGE
  ═══════════════════════════════ */
  #stage {
    position: fixed; inset: 0;
    z-index: 10;
    transition: opacity 0.6s ease 0.2s;
  }

  #stage.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ── Velvet curtain panels ── */
  .curtain {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    overflow: hidden;
    transition: transform 1.7s cubic-bezier(0.76, 0, 0.24, 1);
  }
  .curtain.left  { left: 0; }
  .curtain.right { right: 0; transform: scaleX(-1); }

  #stage.open .curtain.left  { transform: translateX(-100%); }
  #stage.open .curtain.right { transform: scaleX(-1) translateX(-100%); }

  .curtain-body {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.22) 0px,
        rgba(0,0,0,0.00) 22px,
        rgba(0,0,0,0.14) 44px
      ),
      linear-gradient(170deg, #8b1010 0%, #5c0808 25%, #941a1a 55%, #4a0505 85%, #6b0e0e 100%);
    box-shadow: inset -8px 0 30px rgba(0,0,0,0.4);
  }

  /* Inner gold edge */
  .curtain-body::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 7px;
    background: linear-gradient(180deg,
      #b8860b, #f5d16a 15%, #d4af37 35%,
      #f5e06a 55%, #c9a227 75%, #f5d16a 90%, #b8860b
    );
    box-shadow: 0 0 18px rgba(212,175,55,0.5);
  }

  /* Fabric fold shadows */
  .folds {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.00)  0%, rgba(0,0,0,0.18) 8%,
      rgba(255,255,255,0.03) 12%, rgba(0,0,0,0.00) 16%,
      rgba(0,0,0,0.12) 24%, rgba(255,255,255,0.02) 28%,
      rgba(0,0,0,0.00) 33%
    );
  }

  /* ── Pelmet / Valance ── */
  #pelmet {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: clamp(70px, 12vh, 120px);
    background: linear-gradient(180deg, #5a0707 0%, #7c1212 50%, #4a0505 100%);
    border-bottom: 3px solid #d4af37;
    z-index: 30;
    overflow: hidden;
  }

  #pelmet::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(212,175,55,0.12) 0px, transparent 24px
    );
  }

  /* Scallop hem */
  #pelmet::after {
    content: '';
    position: absolute;
    bottom: -18px; left: 0; right: 0;
    height: 36px;
    background:
      radial-gradient(circle at 50% 0%, #7c1212 18px, transparent 18px),
      radial-gradient(circle at 0%  0%, #7c1212 18px, transparent 18px),
      radial-gradient(circle at 100% 0%, #7c1212 18px, transparent 18px);
    background-size: 36px 36px, 36px 36px, 36px 36px;
    background-position: 18px 0, 0 0, -18px 0;
    background-repeat: repeat-x, repeat-x, repeat-x;
  }

  .pelmet-title {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: clamp(11px, 2.4vw, 17px);
    letter-spacing: clamp(4px, 1.2vw, 10px);
    color: #f5d16a;
    font-weight: 600;
    text-shadow: 0 0 20px rgba(212,175,55,0.7), 0 2px 4px rgba(0,0,0,0.5);
    z-index: 2;
  }

  /* Tassel row */
  .tassels {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    padding: 0 6px;
  }

  .tassel {
    display: flex; flex-direction: column; align-items: center;
  }
  .t-cord  { width: 1.5px; height: clamp(14px,2.5vh,26px); background: linear-gradient(180deg,#c9a227,#e8c84a); }
  .t-ball  {
    width: clamp(9px,1.6vw,14px); height: clamp(9px,1.6vw,14px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f5e06a, #c9a227);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .t-fringe { display: flex; gap: 1.5px; margin-top: 1px; }
  .t-strand { width: 1px; height: clamp(8px,1.4vh,14px); background: #d4af37; opacity: 0.75; border-radius: 1px; }

  /* ── Centre open-button ── */
  #open-btn {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: clamp(10px,2.5vh,18px);
    animation: gentlePulse 3s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-outer {
    position: relative;
    width: clamp(100px, 20vw, 150px);
    height: clamp(100px, 20vw, 150px);
    border-radius: 50%;
  }

  /* Animated ring */
  .btn-outer::before {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 1.5px solid rgba(212,175,55,0.4);
    animation: spinRing 8s linear infinite;
  }
  .btn-outer::after {
    content: '';
    position: absolute; inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.18);
    animation: spinRing 14s linear infinite reverse;
  }

  .btn-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 38%,
      rgba(100,8,8,0.85) 0%,
      rgba(60,4,4,0.92) 60%,
      rgba(20,2,2,0.97) 100%
    );
    border: 2px solid rgba(212,175,55,0.55);
    box-shadow:
      0 0 30px rgba(212,175,55,0.2),
      0 0 60px rgba(139,16,16,0.3),
      inset 0 1px 0 rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
  }

  .play-icon {
    font-size: clamp(30px, 6vw, 46px);
    filter: drop-shadow(0 0 10px rgba(212,175,55,0.9));
    transition: transform 0.2s ease;
  }
  #open-btn:hover .play-icon { transform: scale(1.15); }

  .btn-label {
    font-family: 'Cinzel', serif;
    color: #f5d16a;
    font-size: clamp(9px, 1.9vw, 13px);
    letter-spacing: clamp(3px,1vw,7px);
    font-weight: 400;
    text-shadow: 0 0 14px rgba(212,175,55,0.7);
  }

  /* ── Ambient glow between curtains ── */
  #centre-glow {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 100%;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(212,175,55,0.08) 30%,
      rgba(212,175,55,0.14) 50%,
      rgba(212,175,55,0.08) 70%,
      transparent 100%
    );
    box-shadow: 0 0 30px 15px rgba(212,175,55,0.06);
    pointer-events: none;
  }

  /* ── Floating sparkles ── */
  .spark {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: floatSpark linear infinite;
    opacity: 0;
  }

  /* ═══════════════════════════════
     KEYFRAMES
  ═══════════════════════════════ */
  @keyframes gentlePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%       { transform: translate(-50%, -50%) scale(1.06); }
  }

  @keyframes spinRing {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes floatSpark {
    0%   { opacity: 0;   transform: translate(0, 0) scale(0); }
    15%  { opacity: 0.9; transform: translate(0, -12px) scale(1); }
    85%  { opacity: 0.4; transform: translate(0, -38px) scale(0.6); }
    100% { opacity: 0;   transform: translate(0, -55px) scale(0); }
  }

  /* Mobile tweaks */
  @media (max-width: 480px) {
    .btn-label { letter-spacing: 3px; }
    .pelmet-title { letter-spacing: 4px; }
  }
</style>
</head>
<body>

<!-- ── VIDEO (behind curtain) ── -->
<div id="video-wrap">
  <video id="wedding-video" playsinline preload="auto" loop>
    <source src="wedding.mp4" type="video/mp4">
  </video>
</div>

<!-- ── CURTAIN STAGE ── -->
<div id="stage">

  <!-- Pelmet -->
  <div id="pelmet">
    <div class="pelmet-title">✦ &nbsp;&nbsp; WEDDING INVITATION &nbsp;&nbsp; ✦</div>
    <div class="tassels" id="tassels"></div>
  </div>

  <!-- Left curtain -->
  <div class="curtain left">
    <div class="curtain-body"><div class="folds"></div></div>
  </div>

  <!-- Right curtain -->
  <div class="curtain right">
    <div class="curtain-body"><div class="folds"></div></div>
  </div>

  <!-- Centre glow line -->
  <div id="centre-glow"></div>

  <!-- Sparkles container -->
  <div id="sparks"></div>

  <!-- Open button -->
  <button id="open-btn" onclick="openCurtain()" aria-label="Open Invitation">
    <div class="btn-outer">
      <div class="btn-inner">
        <span class="play-icon">▶</span>
      </div>
    </div>
    <span class="btn-label">OPEN INVITATION</span>
  </button>

</div>

<script>
  /* ── Build tassels ── */
  const tasselsEl = document.getElementById('tassels');
  for (let i = 0; i < 32; i++) {
    const t = document.createElement('div');
    t.className = 'tassel';
    t.innerHTML =
      '<div class="t-cord"></div>' +
      '<div class="t-ball"></div>' +
      '<div class="t-fringe">' +
        '<div class="t-strand"></div>'.repeat(5) +
      '</div>';
    tasselsEl.appendChild(t);
  }

  /* ── Build sparkles ── */
  const sparksEl = document.getElementById('sparks');
  const colors = ['#d4af37','#f5e06a','#c9a227','#fff8dc','#ffd700'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const size = 2 + Math.random() * 4;
    s.style.cssText = `
      left: ${Math.random() * 98}%;
      top:  ${20 + Math.random() * 70}%;
      width: ${size}px; height: ${size}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      box-shadow: 0 0 ${size * 2}px ${colors[0]};
      animation-duration: ${2.5 + Math.random() * 3.5}s;
      animation-delay:    ${Math.random() * 4}s;
    `;
    sparksEl.appendChild(s);
  }

  /* ── Open curtain handler ── */
  function openCurtain() {
    const stage = document.getElementById('stage');
    const video = document.getElementById('wedding-video');
    const btn   = document.getElementById('open-btn');

    btn.style.pointerEvents = 'none';
    btn.style.transition = 'opacity 0.4s';
    btn.style.opacity = '0';

    // Open curtains
    stage.classList.add('open');

    // Play video — try with audio first, fallback to muted
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play();
    });

    // Fade out the whole stage overlay after curtains finish
    setTimeout(() => stage.classList.add('hidden'), 2000);
  }
</script>
</body>
</html>
